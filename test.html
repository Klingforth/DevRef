<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Brainfuck Labor</title>
    <style>
        body { font-family: 'monospace'; background: #121212; color: #00ff00; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        textarea { width: 100%; height: 150px; background: #1e1e1e; color: #00ff00; border: 1px solid #333; padding: 10px; font-size: 16px; }
        .controls { margin-top: 10px; display: flex; gap: 10px; }
        button { background: #00ff00; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        button:hover { background: #00cc00; }
        .output-box { margin-top: 20px; background: #000; border: 1px dashed #00ff00; padding: 10px; min-height: 50px; white-space: pre-wrap; }
        .tape-view { margin-top: 20px; display: flex; overflow-x: auto; gap: 5px; padding-bottom: 10px; }
        .cell { border: 1px solid #444; padding: 5px; min-width: 30px; text-align: center; font-size: 12px; }
        .active { background: #00ff00; color: #000; }
    </style>
</head>
<body>

<div class="container">
    <h2>>_ BRAINFUCK_INTERPRETER</h2>
    
    <textarea id="code" placeholder="Schreib deinen BF-Code hier...">+++ [ > +++++++ < - ] > ++++ .</textarea>
    
    <div class="controls">
        <button onclick="runBF()">RUN PROGRAM</button>
        <button onclick="clearAll()" style="background: #ff4444;">CLEAR</button>
    </div>

    <h3>OUTPUT:</h3>
    <div id="output" class="output-box"></div>

    <h3>MEMORY TAPE (First 20 Cells):</h3>
    <div id="tape" class="tape-view"></div>
</div>

<script>
    function runBF() {
        const code = document.getElementById('code').value;
        const outputDiv = document.getElementById('output');
        const tapeDiv = document.getElementById('tape');
        outputDiv.innerText = '';
        
        let tape = new Uint8Array(30000); // Genau wie uint8 in Nim/C!
        let dp = 0; // Data Pointer
        let pc = 0; // Program Counter
        let output = "";
        let steps = 0;
        const maxSteps = 1000000; // Schutz gegen Endlosschleifen

        // Klammern-Mapping (Jump Table Vorbereitung)
        let jumps = {};
        let stack = [];
        for (let i = 0; i < code.length; i++) {
            if (code[i] === '[') stack.push(i);
            else if (code[i] === ']') {
                let start = stack.pop();
                jumps[start] = i;
                jumps[i] = start;
            }
        }

        while (pc < code.length && steps < maxSteps) {
            let char = code[pc];
            switch (char) {
                case '>': dp++; break;
                case '<': dp--; break;
                case '+': tape[dp]++; break;
                case '-': tape[dp]--; break;
                case '.': output += String.fromCharCode(tape[dp]); break;
                case '[': if (tape[dp] === 0) pc = jumps[pc]; break;
                case ']': if (tape[dp] !== 0) pc = jumps[pc]; break;
            }
            pc++;
            steps++;
        }

        outputDiv.innerText = output || "(Keine Ausgabe)";
        updateTape(tape, dp);
    }

    function updateTape(tape, currentPtr) {
        const tapeDiv = document.getElementById('tape');
        tapeDiv.innerHTML = '';
        for (let i = 0; i < 20; i++) {
            let cell = document.createElement('div');
            cell.className = 'cell' + (i === currentPtr ? ' active' : '');
            cell.innerText = tape[i];
            tapeDiv.appendChild(cell);
        }
    }

    function clearAll() {
        document.getElementById('code').value = '';
        document.getElementById('output').innerText = '';
        document.getElementById('tape').innerHTML = '';
    }

    // Initial Tape View
    updateTape(new Uint8Array(30000), 0);
</script>

</body>
</html>
