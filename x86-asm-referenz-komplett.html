<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>x86 Assembly Referenz</title>
<style>
:root{--bg:#0a0c0f;--surface:#0d1117;--border:#1e2530;--text:#cdd6f4;--dim:#6c7a8e;--accent:#00ff88}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;line-height:1.5}
#hdr{background:linear-gradient(135deg,#0f1217,#0a0c0f);border-bottom:1px solid var(--border);padding:14px 24px 0;position:sticky;top:0;z-index:100}
#hdr-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
#hdr-title{font-size:20px;font-weight:900}
#hdr-sub{color:var(--dim);font-size:11px}
#arch-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.ab-btn{border:1px solid;border-radius:20px;padding:4px 16px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;transition:all .15s;background:transparent}
#tabs{display:flex;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tb{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--dim);padding:9px 13px;cursor:pointer;font-size:12px;font-family:inherit;white-space:nowrap}
.tb.active{color:var(--accent);border-bottom-color:var(--accent)}
.con{max-width:1120px;margin:0 auto;padding:20px 22px 60px}
.tp{display:none}.tp.active{display:block}
.sb{width:100%;background:rgba(0,0,0,.6);border:1px solid var(--border);border-radius:6px;padding:8px 12px;color:var(--text);font-size:13px;font-family:inherit;margin-bottom:12px;outline:none}
.ac{border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.06);margin-bottom:10px}
.ah{width:100%;text-align:left;border:none;padding:11px 16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-family:inherit;font-weight:700;font-size:13px}
.ah:hover{filter:brightness(1.2)}
.aa{font-size:10px;transition:transform .2s}
.ab-body{display:none;padding:4px 12px 14px}
.ac.open .ab-body{display:block}
.ac.open .aa{transform:rotate(180deg)}
table{width:100%;border-collapse:collapse}
th{color:var(--dim);font-size:10px;text-align:left;padding:6px 8px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border);font-family:inherit}
td{padding:7px 8px;border-bottom:1px solid rgba(30,37,48,.4);font-size:12px;vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.015)}
code{font-family:'Courier New',monospace;font-size:12px;background:rgba(255,255,255,.05);padding:1px 5px;border-radius:3px}
pre.cb{font-family:'Courier New',monospace;font-size:12px;color:var(--text);background:rgba(0,0,0,.7);border:1px solid var(--border);border-radius:6px;padding:15px;overflow-x:auto;line-height:1.8;white-space:pre}
.bg{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-family:inherit;white-space:nowrap}
.cd{background:rgba(0,0,0,.55);border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:8px}
.er{display:flex;gap:12px;padding:7px 4px;border-bottom:1px solid rgba(30,37,48,.3);align-items:flex-start}
.er:last-child{border-bottom:none}
.ek{min-width:230px;flex-shrink:0}
.aind{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:6px;margin-bottom:14px;font-size:12px;font-weight:700}
.tc{background:rgba(0,0,0,.55);border:1px solid var(--border);border-radius:6px;padding:10px 14px;margin-bottom:8px}
@media(max-width:720px){.con{padding:14px 12px 40px}.ek{min-width:150px}}
</style></head><body>
<div id="hdr">
<div id="hdr-top">
  <div id="hdr-title">x86 <span style="color:#00ff88">ASM</span></div>
  <div id="hdr-sub">8/16/32/64-Bit — Arch Linux / CachyOS</div>
</div>
<div id="arch-bar">
  <button class="ab-btn" data-arch="8"  onclick="setArch('8')"  style="color:#ff9800;border-color:#ff980088">8-Bit</button>
  <button class="ab-btn" data-arch="16" onclick="setArch('16')" style="color:#ffb347;border-color:#ffb34788">16-Bit</button>
  <button class="ab-btn" data-arch="32" onclick="setArch('32')" style="color:#4fc3f7;border-color:#4fc3f788">32-Bit</button>
  <button class="ab-btn active" data-arch="64" onclick="setArch('64')" style="color:#0a0c0f;background:#00ff88;border-color:#00ff88">64-Bit</button>
</div>
<div id="tabs">
  <button class="tb active" data-tab="registers">Register</button>
  <button class="tb" data-tab="instructions">Instruktionen</button>
  <button class="tb" data-tab="addressing">Adressierung</button>
  <button class="tb" data-tab="syscalls">Syscalls</button>
  <button class="tb" data-tab="examples">Beispiele</button>
  <button class="tb" data-tab="tools">Tools</button>
  <button class="tb" data-tab="compare">Vergleich</button>
</div></div>
<div class="con">
<div id="tp-registers" class="tp active"></div>
<div id="tp-instructions" class="tp "></div>
<div id="tp-addressing" class="tp "></div>
<div id="tp-syscalls" class="tp "></div>
<div id="tp-examples" class="tp "></div>
<div id="tp-tools" class="tp "></div>
<div id="tp-compare" class="tp "></div>
</div>
<script>
let arch='64';
const REG_8='<div class="ac open" id="ac-r80" style="border-color:#ff980044">\n<button class="ah" onclick="tAcc(\'r80\')" style="background:#ff98000e">\n<span style="color:#ff9800">◆ 8-Bit Register (8086)</span>\n<span class="aa" style="color:#ff9800">▼</span>\n</button><div class="ab-body"><table><thead><tr><th>Register</th><th>Bit</th><th>Alias</th><th>Verwendung</th></tr></thead><tbody><tr><td>AL / AH</td><td style="color:#4a5568">8-bit</td><td style="color:var(--dim)">AX</td><td>Accumulator Low/High – I/O, Arithmetik</td></tr><tr><td>BL / BH</td><td style="color:#4a5568">8-bit</td><td style="color:var(--dim)">BX</td><td>Base Low/High – XLAT-Adresse</td></tr><tr><td>CL / CH</td><td style="color:#4a5568">8-bit</td><td style="color:var(--dim)">CX</td><td>Counter Low/High – Shift (CL), Loop (CX)</td></tr><tr><td>DL / DH</td><td style="color:#4a5568">8-bit</td><td style="color:var(--dim)">DX</td><td>Data Low/High – I/O, MUL/DIV High</td></tr></tbody></table></div></div><div class="ac " id="ac-r81" style="border-color:#ffb34744">\n<button class="ah" onclick="tAcc(\'r81\')" style="background:#ffb3470e">\n<span style="color:#ffb347">◆ 16-Bit Register (8086)</span>\n<span class="aa" style="color:#ffb347">▼</span>\n</button><div class="ab-body"><table><thead><tr><th>Register</th><th>Bit</th><th>Alias</th><th>Verwendung</th></tr></thead><tbody><tr><td>AX</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Akkumulator – Rückgabewert</td></tr><tr><td>BX</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Base – [BX] Adressierung</td></tr><tr><td>CX</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Counter – LOOP, REP-Präfix</td></tr><tr><td>DX</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Data – I/O, MUL/DIV High-Word</td></tr><tr><td>SI</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Source Index</td></tr><tr><td>DI</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Destination Index</td></tr><tr><td>SP</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Stack Pointer</td></tr><tr><td>BP</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Base Pointer</td></tr></tbody></table></div></div><div class="ac " id="ac-r82" style="border-color:#ff537044">\n<button class="ah" onclick="tAcc(\'r82\')" style="background:#ff53700e">\n<span style="color:#ff5370">◆ Segment- &amp; Sonderregister</span>\n<span class="aa" style="color:#ff5370">▼</span>\n</button><div class="ab-body"><table><thead><tr><th>Register</th><th>Bit</th><th>Alias</th><th>Verwendung</th></tr></thead><tbody><tr><td>CS</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Code Segment – Basis × 16 + IP</td></tr><tr><td>DS</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Data Segment</td></tr><tr><td>ES</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Extra Segment – Ziel STOSB/MOVSB</td></tr><tr><td>SS</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Stack Segment</td></tr><tr><td>IP</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Instruction Pointer</td></tr><tr><td>FLAGS</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>CF,PF,AF,ZF,SF,TF,IF,DF,OF</td></tr></tbody></table></div></div>';
const REG_16='<div class="ac open" id="ac-r160" style="border-color:#ffb34744">\n<button class="ah" onclick="tAcc(\'r160\')" style="background:#ffb3470e">\n<span style="color:#ffb347">◆ 16-Bit Allgemein</span>\n<span class="aa" style="color:#ffb347">▼</span>\n</button><div class="ab-body"><table><thead><tr><th>Register</th><th>Bit</th><th>Alias</th><th>Verwendung</th></tr></thead><tbody><tr><td>AX (AH:AL)</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Akkumulator – Rückgabewert, MUL/DIV</td></tr><tr><td>BX (BH:BL)</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Base – [BX], [BX+SI], [BX+DI]</td></tr><tr><td>CX (CH:CL)</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Counter – LOOP, REP (Zähler), Shift via CL</td></tr><tr><td>DX (DH:DL)</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Data – I/O, MUL/DIV High-Word</td></tr><tr><td>SI</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Source Index – Stringquelle, [SI], [BX+SI]</td></tr><tr><td>DI</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Destination Index – Stringziel, [DI]</td></tr><tr><td>SP</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Stack Pointer</td></tr><tr><td>BP</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Base Pointer – [BP±offset]</td></tr></tbody></table></div></div><div class="ac " id="ac-r161" style="border-color:#c792ea44">\n<button class="ah" onclick="tAcc(\'r161\')" style="background:#c792ea0e">\n<span style="color:#c792ea">◆ Segmentregister</span>\n<span class="aa" style="color:#c792ea">▼</span>\n</button><div class="ab-body"><table><thead><tr><th>Register</th><th>Bit</th><th>Alias</th><th>Verwendung</th></tr></thead><tbody><tr><td>CS</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Segmentbasis × 16 + IP = physische Adresse</td></tr><tr><td>DS</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Standard für Daten</td></tr><tr><td>ES</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Extra – Ziel STOSB/MOVSB → ES:DI</td></tr><tr><td>SS</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">—</td><td>Stack – SS:SP zeigt auf Stack</td></tr><tr><td>FS/GS</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">286+</td><td>Nur ab 286 Protected Mode</td></tr></tbody></table></div></div>';
const REG_32='<div class="ac open" id="ac-r320" style="border-color:#4fc3f744">\n<button class="ah" onclick="tAcc(\'r320\')" style="background:#4fc3f70e">\n<span style="color:#4fc3f7">◆ 32-Bit GPR (i386+)</span>\n<span class="aa" style="color:#4fc3f7">▼</span>\n</button><div class="ab-body"><table><thead><tr><th>Register</th><th>Bit</th><th>Alias</th><th>Verwendung</th></tr></thead><tbody><tr><td>EAX</td><td style="color:#4a5568">32-bit</td><td style="color:var(--dim)">AX/AL/AH</td><td>Accumulator – Rückgabewert, Arithmetik</td></tr><tr><td>EBX</td><td style="color:#4a5568">32-bit</td><td style="color:var(--dim)">BX/BL/BH</td><td>Base – callee-saved, Adressierung</td></tr><tr><td>ECX</td><td style="color:#4a5568">32-bit</td><td style="color:var(--dim)">CX/CL/CH</td><td>Counter – Schleifen, Shift, 1. Arg (fastcall)</td></tr><tr><td>EDX</td><td style="color:#4a5568">32-bit</td><td style="color:var(--dim)">DX/DL/DH</td><td>Data – I/O, MUL/DIV High-DWord</td></tr><tr><td>ESI</td><td style="color:#4a5568">32-bit</td><td style="color:var(--dim)">SI/SIL</td><td>Source Index – Stringoperationen</td></tr><tr><td>EDI</td><td style="color:#4a5568">32-bit</td><td style="color:var(--dim)">DI/DIL</td><td>Destination Index – Stringziel</td></tr><tr><td>ESP</td><td style="color:#4a5568">32-bit</td><td style="color:var(--dim)">SP/SPL</td><td>Stack Pointer (4 Byte ausgerichtet)</td></tr><tr><td>EBP</td><td style="color:#4a5568">32-bit</td><td style="color:var(--dim)">BP/BPL</td><td>Frame-Basis (callee-saved)</td></tr></tbody></table></div></div><div class="ac " id="ac-r321" style="border-color:#c792ea44">\n<button class="ah" onclick="tAcc(\'r321\')" style="background:#c792ea0e">\n<span style="color:#c792ea">◆ SSE-Register (Pentium III+)</span>\n<span class="aa" style="color:#c792ea">▼</span>\n</button><div class="ab-body"><table><thead><tr><th>Register</th><th>Bit</th><th>Alias</th><th>Verwendung</th></tr></thead><tbody><tr><td>XMM0–XMM7</td><td style="color:#4a5568">128-bit</td><td style="color:var(--dim)">SSE–SSE4</td><td>128-Bit SIMD (nur 8 in 32-Bit)</td></tr><tr><td>MM0–MM7</td><td style="color:#4a5568">64-bit</td><td style="color:var(--dim)">MMX</td><td>64-Bit MMX (aliasiert FPU-Stack)</td></tr><tr><td>ST(0)–ST(7)</td><td style="color:#4a5568">80-bit</td><td style="color:var(--dim)">x87</td><td>80-Bit FPU Stack</td></tr></tbody></table></div></div>';
const REG_64='<div class="ac open" id="ac-r640" style="border-color:#00ff8844">\n<button class="ah" onclick="tAcc(\'r640\')" style="background:#00ff880e">\n<span style="color:#00ff88">◆ 64-Bit GPR</span>\n<span class="aa" style="color:#00ff88">▼</span>\n</button><div class="ab-body"><table><thead><tr><th>Register</th><th>Bit</th><th>Alias</th><th>Verwendung</th></tr></thead><tbody><tr><td>RAX</td><td style="color:#4a5568">64-bit</td><td style="color:var(--dim)">EAX/AX/AL/AH</td><td>Accumulator – Rückgabewert, Syscall-Nr.</td></tr><tr><td>RBX</td><td style="color:#4a5568">64-bit</td><td style="color:var(--dim)">EBX/BX/BL/BH</td><td>Base – callee-saved</td></tr><tr><td>RCX</td><td style="color:#4a5568">64-bit</td><td style="color:var(--dim)">ECX/CX/CL/CH</td><td>Counter – 4. Argument (SysV)</td></tr><tr><td>RDX</td><td style="color:#4a5568">64-bit</td><td style="color:var(--dim)">EDX/DX/DL/DH</td><td>Data – 3. Argument, MUL/DIV High</td></tr><tr><td>RSI</td><td style="color:#4a5568">64-bit</td><td style="color:var(--dim)">ESI/SI/SIL</td><td>Source – 2. Argument (SysV)</td></tr><tr><td>RDI</td><td style="color:#4a5568">64-bit</td><td style="color:var(--dim)">EDI/DI/DIL</td><td>Destination – 1. Argument (SysV)</td></tr><tr><td>RSP</td><td style="color:#4a5568">64-bit</td><td style="color:var(--dim)">ESP/SP/SPL</td><td>Stack Pointer – 16-Byte vor CALL</td></tr><tr><td>RBP</td><td style="color:#4a5568">64-bit</td><td style="color:var(--dim)">EBP/BP/BPL</td><td>Base Pointer – callee-saved</td></tr><tr><td>R8–R15</td><td style="color:#4a5568">64-bit</td><td style="color:var(--dim)">R8D/R8W/R8B</td><td>5.–6. Argument (SysV)</td></tr></tbody></table></div></div><div class="ac " id="ac-r641" style="border-color:#ffb34744">\n<button class="ah" onclick="tAcc(\'r641\')" style="background:#ffb3470e">\n<span style="color:#ffb347">◆ Spezialregister</span>\n<span class="aa" style="color:#ffb347">▼</span>\n</button><div class="ab-body"><table><thead><tr><th>Register</th><th>Bit</th><th>Alias</th><th>Verwendung</th></tr></thead><tbody><tr><td>RIP</td><td style="color:#4a5568">64-bit</td><td style="color:var(--dim)">EIP/IP</td><td>Instruction Pointer</td></tr><tr><td>RFLAGS</td><td style="color:#4a5568">64-bit</td><td style="color:var(--dim)">EFLAGS</td><td>CF,PF,AF,ZF,SF,TF,IF,DF,OF,IOPL,NT,RF,VM,AC</td></tr><tr><td>FS/GS</td><td style="color:#4a5568">16-bit</td><td style="color:var(--dim)">Segmente</td><td>Thread-Local Storage (Linux: GS=TLS)</td></tr></tbody></table></div></div><div class="ac " id="ac-r642" style="border-color:#c792ea44">\n<button class="ah" onclick="tAcc(\'r642\')" style="background:#c792ea0e">\n<span style="color:#c792ea">◆ SIMD</span>\n<span class="aa" style="color:#c792ea">▼</span>\n</button><div class="ab-body"><table><thead><tr><th>Register</th><th>Bit</th><th>Alias</th><th>Verwendung</th></tr></thead><tbody><tr><td>XMM0–XMM15</td><td style="color:#4a5568">128-bit</td><td style="color:var(--dim)">SSE–SSE4</td><td>128-Bit SIMD</td></tr><tr><td>YMM0–YMM15</td><td style="color:#4a5568">256-bit</td><td style="color:var(--dim)">AVX/AVX2</td><td>256-Bit SIMD – 8× float</td></tr><tr><td>ZMM0–ZMM31</td><td style="color:#4a5568">512-bit</td><td style="color:var(--dim)">AVX-512</td><td>512-Bit SIMD – 16× float</td></tr><tr><td>K0–K7</td><td style="color:#4a5568">64-bit</td><td style="color:var(--dim)">AVX-512</td><td>Masken-Register für Predikation</td></tr></tbody></table></div></div>';
const INS_8='<div class="ac open" id="ac-i80" style="border-color:#ff980044">\n<button class="ah" onclick="tAcc(\'i80\')" style="background:#ff98000e">\n<span style="color:#ff9800">◆ Datentransfer</span>\n<span class="aa" style="color:#ff9800">▼</span>\n</button><div class="ab-body"><div><div class="er"><div class="ek"><code style="color:#ff9800">MOV dst, src</code></div><div style="color:var(--dim);font-size:12px">Kopiert src → dst</div></div><div class="er"><div class="ek"><code style="color:#ff9800">PUSH src / POP dst</code></div><div style="color:var(--dim);font-size:12px">SP -= 2; [SS:SP] = src  /  dst = [SS:SP]; SP += 2</div></div><div class="er"><div class="ek"><code style="color:#ff9800">XCHG dst, src</code></div><div style="color:var(--dim);font-size:12px">Tauschen</div></div><div class="er"><div class="ek"><code style="color:#ff9800">IN AL, port / OUT port, AL</code></div><div style="color:var(--dim);font-size:12px">I/O-Port lesen/schreiben</div></div><div class="er"><div class="ek"><code style="color:#ff9800">LEA reg, [mem]</code></div><div style="color:var(--dim);font-size:12px">Load Effective Address</div></div><div class="er"><div class="ek"><code style="color:#ff9800">XLAT / XLATB</code></div><div style="color:var(--dim);font-size:12px">AL = [BX + AL] – Tabellen-Lookup</div></div></div></div></div><div class="ac " id="ac-i81" style="border-color:#ffb34744">\n<button class="ah" onclick="tAcc(\'i81\')" style="background:#ffb3470e">\n<span style="color:#ffb347">◆ Arithmetik &amp; Logik</span>\n<span class="aa" style="color:#ffb347">▼</span>\n</button><div class="ab-body"><div><div class="er"><div class="ek"><code style="color:#ffb347">ADD / SUB</code></div><div style="color:var(--dim);font-size:12px">± – setzt CF,ZF,SF,OF</div></div><div class="er"><div class="ek"><code style="color:#ffb347">ADC / SBB</code></div><div style="color:var(--dim);font-size:12px">Add/Sub with Carry</div></div><div class="er"><div class="ek"><code style="color:#ffb347">MUL src< const INS_32='<div class="ac open" id="ac-i320" style="border-color:#4fc3f744">\n<button class="ah" onclick="tAcc(\'i320\')" style="background:#4fc3f70e">\n<span style="color:#4fc3f7">◆ Datentransfer (32-Bit)</span>\n<span class="aa" style="color:#4fc3f7">▼</span>\n</button><div class="ab-body"><div><div class="er"><div class="ek"><code style="color:#4fc3f7">MOV dst, src</code></div><div style="color:var(--dim);font-size:12px">32-Bit Operanden</div></div><div class="er"><div class="ek"><code style="color:#4fc3f7">MOVZX / MOVSX</code></div><div style="color:var(--dim);font-size:12px">Zero/Sign-Extend: 8→32, 16→32</div></div><div class="er"><div class="ek"><code style="color:#4fc3f7">PUSHAD / POPAD</code></div><div style="color:var(--dim);font-size:12px">Alle 8 GPRs 32-Bit</div></div><div class="er"><div class="ek"><code style="color:#4fc3f7">PUSHFD / POPFD</code></div><div style="color:var(--dim);font-size:12px">EFLAGS push/pop</div></div><div class="er"><div class="ek"><code style="color:#4fc3f7">CMOV[cc]</code></div><div style="color:var(--dim);font-size:12px">Bedingtes MOV – kein Branch (Pentium Pro+)</div></div><div class="er"><div class="ek"><code style="color:#4fc3f7">BSWAP reg32</code></div><div style="color:var(--dim);font-size:12px">Byte-Reihenfolge umkehren</div></div></div></div></div><div class="ac " id="ac-i321" style="border-color:#00ff8844">\n<button class="ah" onclick="tAcc(\'i321\')" style="background:#00ff880e">\n<span style="color:#00ff88">◆ SSE-Grundbefehle</span>\n<span class="aa" style="color:#00ff88">▼</span>\n</button><div class="ab-body"><div><div class="er"><div class="ek"><code style="color:#00ff88">MOVAPS/MOVUPS</code></div><div style="color:var(--dim);font-size:12px">Aligned/Unaligned 128-Bit Load/Store</div></div><div class="er"><div class="ek"><code style="color:#00ff88">ADDPS/SUBPS/MULPS/DIVPS</code></div><div style="color:var(--dim);font-size:12px">Packed Single-Precision</div></div><div class="er"><div class="ek"><code style="color:# const TOOLS_HTML='<div class="aind" style="background:#00ff8811;border:1px solid #00ff8844;color:#00ff88">Arch / CachyOS: <code style="color:#ffb347">sudo pacman -S nasm binutils gdb strace radare2 qemu bochs</code></div><div class="ac open" id="ac-tl0" style="border-color:#00ff8844">\n<button class="ah" onclick="tAcc(\'tl0\')" style="background:#00ff880e">\n<span style="color:#00ff88">◆ ⚙ Assembler</span>\n<span class="aa" style="color:#00ff88">▼</span>\n</button><div class="ab-body"><div class="tc"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="color:#00ff88;font-weight:700">NASM</span><span style="background:#4a556822;color:#6c7a8e;border:1px solid #44506a44;padding:1px 7px;border-radius:4px;font-size:11px">nasm</span></div><code style="color:#ffb347">nasm -f elf64 foo.asm -o foo.o  |  nasm -f bin boot.asm</code></div><div class="tc"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="color:#00ff88;font-weight:700">FASM</span><span style="background:#4a556822;color:#6c7a8e;border:1px solid #44506a44;padding:1px 7px;border-radius:4px;font-size:11px">fasm</span></div><code style="color:#ffb347">fasm foo.asm</code></div><div class="tc"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="color:#00ff88;font-weight:700">GNU as</span><span style="background:#4a556822;color:#6c7a8e;border:1px solid #44506a44;padding:1px 7px;border-radius:4px;font-size:11px">binutils</span></div><code style="color:#ffb347">as -o foo.o foo.s   |   as --32 foo.s -o foo.o</code></div><div class="tc"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="color:#00ff88;font-weight:700">YASM</span><span style="background:#4a556822;color:#6c7a8e;border:1px solid #44506a44;padding:1px 7px;border-radius:4px;font-size:11px">yasm</span></div><code style="color:#ffb347">yasm -f elf64 foo.asm</code></div></div></div><div class="ac " id="ac-tl1" style="border-color:#4fc3f744">\n<button class="ah" onclick="tAcc(\'tl1\')" style="background:#4fc3f70e">\n<span style="color:#4fc3f7">◆ ⚙ Linker &amp; Compiler</span>\n<span class="aa" style="color:#4fc3f7">▼</span>\n</button><div class="ab-body"><div class="tc"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="color:#4fc3f7;font-weight:700">ld</span><span style="background:#4a556822;color:#6c7a8e;border:1px solid #44506a44;padding:1px 7px;border-radius:4px;font-size:11px">binutils</span></div><code style="color:#ffb347">ld -m elf_x86_64 -o prog foo.o</code></div><div class="tc"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="color:#4fc3f7;font-weight:700">GCC</span><span style="background:#4a556822;color:#6c7a8e;border:1px solid #44506a44;padding:1px 7px;border-radius:4px;font-size:11px">gcc</span></div><code style="color:#ffb347">gcc -m32 -o p foo.c  |  gcc -m64 -o p foo.c</code></div><div class="tc"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="color:#4fc3f7;font-weight:700">Clang</span><span style="background:#4a556822;color:#6c7a8e;border:1px solid #44506a44;padding:1px 7px;border-radius:4px;font-size:11px">clang</span></div><code style="color:#ffb347">clang -m64 -o p foo.s</code></div></div></div><div class="ac " id="ac-tl2" style="border-color:#ffb34744">\n<button class="ah" onclick="tAcc(\'tl2\')" style="background:#ffb3470e">\n<span style="color:#ffb347">◆ ⚙ Debugger</span>\n<span class="aa" style="color:#ffb347">▼</span>\n</button><div class="ab-body"><div class="tc"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="color:#ffb347;font-weight:700">GDB</span><span style="background:#4a556822;color:#6c7a8e;border:1px solid #44506a44;padding:1px 7px;border-radius:4px;font-size:11px">gdb</span></div><code style="color:#ffb347">gdb ./prog   →   set arch i8086 / i386 / i386:x86-64</code></div><div class="tc"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="color:#ffb347;font-weight:700">PWNDBG</span><span style="background:#4a556822;color:#6c7a8e;border:1px solid #44506a44;padding:1px 7px;border-radius:4px;font-size:11px">pwndbg (AUR)</span></div><code style="color:#ffb347">gdb -q ./prog</code></div><div class="tc"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="color:#ffb347;font-weight:700">radare2</span><span style="background:#4a556822;color:#6c7a8e;border:1px solid #44506a44;padding:1px 7px;border-radius:4px;font-size:11px">radare2</span></div><code style="color:#ffb347">r2 -b 64 -A ./prog   |   r2 -b 16 boot.bin</code></div><div class="tc"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="color:#ffb347;font-weight:700">Bochs</span><span style="background:#4a556822;color:#6c7a8e;border:1px solid #44506a44;padding:1px 7px;border-radius:4px;font-size:11px">bochs</span></div><code style="color:#ffb347">bochs -f bochsrc  (ideal für 16-Bit / Bootsektor)</code></div><div class="tc"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="color:#ffb347;font-weight:700">QEMU</span><span style="background:#4a556822;color:#6c7a8e;border:1px solid #44506a44;padding:1px 7px;border-radius:4px;font-size:11px">qemu</span></div><code style="color:#ffb347">qemu-system-i386 -fda boot.img</code></div></div></div><div class="ac " id="ac-tl3" style="border-color:#c792ea44">\n<button class="ah" onclick="tAcc(\'tl3\')" style="background:#c792ea0e">\n<span style="color:#c792ea">◆ ⚙ Analyse</span>\n<span class="aa" style="color:#c792ea">▼</span>\n</button><div class="ab-body"><div class="tc"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="color:#c792ea;font-weight:700">objdump</span><span style="background:#4a556822;color:#6c7a8e;border:1px solid #44506a44;padding:1px 7px;border-radius:4px;font-size:11px">binutils</span></div><code style="color:#ffb347">objdump -d -M intel prog  |  -m i8086</code></div><div class="tc"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="color:#c792ea;font-weight:700">ndisasm</span><span style="background:#4a556822;color:#6c7a8e;border:1px solid #44506a44;padding:1px 7px;border-radius:4px;font-size:11px">nasm</span></div><code style="color:#ffb347">ndisasm -b 16 boot.bin   |   ndisasm -b 64 foo</code></div><div class="tc"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="color:#c792ea;font-weight:700">strace</span><span style="background:#4a556822;color:#6c7a8e;border:1px solid #44506a44;padding:1px 7px;border-radius:4px;font-size:11px">strace</span></div><code style="color:#ffb347">strace ./prog</code></div><div class="tc"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="color:#c792ea;font-weight:700">Ghidra</span><span style="background:#4a556822;color:#6c7a8e;border:1px solid #44506a44;padding:1px 7px;border-radius:4px;font-size:11px">ghidra (AUR)</span></div><code style="color:#ffb347">ghidra  (alle x86 Architekturen + Decompiler)</code></div></div></div><div class="ac " id="ac-tl4" style="border-color:#ff537044">\n<button class="ah" onclick="tAcc(\'tl4\')" style="background:#ff53700e">\n<span style="color:#ff5370">◆ ⚙ Profiling</span>\n<span class="aa" style="color:#ff5370">▼</span>\n</button><div class="ab-body"><div class="tc"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="color:#ff5370;font-weight:700">perf</span><span style="background:#4a556822;color:#6c7a8e;border:1px solid #44506a44;padding:1px 7px;border-radius:4px;font-size:11px">perf</span></div><code style="color:#ffb347">perf stat ./prog  |  perf record -g ./prog</code></div><div class="tc"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="color:#ff5370;font-weight:700">valgrind</span><span style="background:#4a556822;color:#6c7a8e;border:1px solid #44506a44;padding:1px 7px;border-radius:4px;font-size:11px">valgrind</span></div><code style="color:#ffb347">valgrind --tool=callgrind ./prog</code></div><div class="tc"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="color:#ff5370;font-weight:700">LLVM-MCA</span><span style="background:#4a556822;color:#6c7a8e;border:1px solid #44506a44;padding:1px 7px;border-radius:4px;font-size:11px">llvm</span></div><code style="color:#ffb347">llvm-mca -mcpu=znver4 foo.s</code></div></div></div>';
const COMPARE_HTML='<div style="overflow-x:auto"><table><thead><tr><th>Merkmal</th><th style="color:#ff9800">8-Bit</th><th style="color:#ffb347">16-Bit</th><th style="color:#4fc3f7">32-Bit</th><th style="color:#00ff88">64-Bit</th></tr></thead><tbody id="cmp-body"><tr><td style="color:#ffb347;font-weight:700;font-size:12px;white-space:nowrap">Jahr / CPU</td><td style="font-size:11px" id="cmp-8-0">1978 – Intel 8086</td><td style="font-size:11px" id="cmp-16-1">1982 – Intel 286</td><td style="font-size:11px" id="cmp-32-2">1985 – Intel 386</td><td style="font-size:11px" id="cmp-64-3">2003 – AMD Athlon 64</td></tr><tr><td style="color:#ffb347;font-weight:700;font-size:12px;white-space:nowrap">Adressraum</td><td style="font-size:11px" id="cmp-8-0">1 MB (20-Bit Segment:Offset)</td><td style="font-size:11px" id="cmp-16-1">1 MB Real / 16 MB Protected</td><td style="font-size:11px" id="cmp-32-2">4 GB (Flat, virtuell)</td><td style="font-size:11px" id="cmp-64-3">128 TB virtuell (48-Bit)</td></tr><tr><td style="color:#ffb347;font-weight:700;font-size:12px;white-space:nowrap">Register</td><td style="font-size:11px" id="cmp-8-0">AL-DH, SI, DI, SP, BP (8/16)</td><td style="font-size:11px" id="cmp-16-1">AX-DX, SI, DI + Segmente</td><td style="font-size:11px" id="cmp-32-2">EAX-EDI, ESP, EBP (32-Bit)</td><td style="font-size:11px" id="cmp-64-3">RAX-R15 (64-Bit), 16 Regs</td></tr><tr><td style="color:#ffb347;font-weight:700;font-size:12px;white-space:nowrap">Stack-Breite</td><td style="font-size:11px" id="cmp-8-0">16-Bit (SP ±2)</td><td style="font-size:11px" id="cmp-16-1">16-Bit</td><td style="font-size:11px" id="cmp-32-2">32-Bit (ESP ±4)</td><td style="font-size:11px" id="cmp-64-3">64-Bit (RSP ±8)</td></tr><tr><td style="color:#ffb347;font-weight:700;font-size:12px;white-space:nowrap">SIMD</td><td style="font-size:11px" id="cmp-8-0">Kein (x87 ab 8087)</td><td style="font-size:11px" id="cmp-16-1">x87 FPU</td><td style="font-size:11px" id="cmp-32-2">x87, MMX, SSE–SSE4.2</td><td style="font-size:11px" id="cmp-64-3">SSE–AVX-512, 16→32 Regs</td></tr><tr><td style="color:#ffb347;font-weight:700;font-size:12px;white-space:nowrap">Syscall</td><td style="font-size:11px" id="cmp-8-0">INT 21h (DOS), INT 10h (BIOS)</td><td style="font-size:11px" id="cmp-16-1">INT 21h, INT 31h (DPMI)</td><td style="font-size:11px" id="cmp-32-2">INT 0x80 / SYSENTER</td><td style="font-size:11px" id="cmp-64-3">SYSCALL / SYSRET</td></tr><tr><td style="color:#ffb347;font-weight:700;font-size:12px;white-space:nowrap">Speicher-Modell</td><td style="font-size:11px" id="cmp-8-0">Segmentiert (Seg×16+Off)</td><td style="font-size:11px" id="cmp-16-1">Segmentiert (Real+Protected)</td><td style="font-size:11px" id="cmp-32-2">Flat – Segmente=selber Raum</td><td style="font-size:11px" id="cmp-64-3">Flat, nur FS/GS für TLS</td></tr><tr><td style="color:#ffb347;font-weight:700;font-size:12px;white-space:nowrap">ABI / Aufruf</td><td style="font-size:11px" id="cmp-8-0">AX=Rückgabe</td><td style="font-size:11px" id="cmp-16-1">AX=Rückgabe, Stack-Argumente</td><td style="font-size:11px" id="cmp-32-2">cdecl: EAX, Stack R→L</td><td style="font-size:11px" id="cmp-64-3">SysV: RDI,RSI,RDX,RCX,R8,R9</td></tr><tr><td style="color:#ffb347;font-weight:700;font-size:12px;white-space:nowrap">Linux Workflow</td><td style="font-size:11px" id="cmp-8-0">qemu-system-i386 + DOSBox</td><td style="font-size:11px" id="cmp-16-1">qemu, Bochs</td><td style="font-size:11px" id="cmp-32-2">gcc -m32, ld -m elf_i386</td><td style="font-size:11px" id="cmp-64-3">gcc / nasm default auf Arch</td></tr></tbody></table></div>';

function tAcc(id){document.getElementById('ac-'+id).classList.toggle('open')}

function setArch(a){
  arch=a;
  const colors={'8':'#ff9800','16':'#ffb347','32':'#4fc3f7','64':'#00ff88'};
  document.querySelectorAll('.ab-btn').forEach(b=>{
    const on=b.dataset.arch===a;
    b.style.background=on?colors[b.dataset.arch]:'transparent';
    b.style.color=on?'#0a0c0f':colors[b.dataset.arch];
    b.style.borderColor=on?colors[b.dataset.arch]:colors[b.dataset.arch]+'88';
  });
  renderAll();
}

function renderAll(){
  const r=eval('REG_'+arch);
  const i=eval('INS_'+arch);
  const addr=eval('ADDR_'+arch);
  const sc=eval('SYS_'+arch);
  const ex=eval('EX_'+arch);
  document.getElementById('tp-registers').innerHTML=
    '<div class="aind" style="background:'+({'8':'#ff9800','16':'#ffb347','32':'#4fc3f7','64':'#00ff88'}[arch])+'15;border:1px solid '+({'8':'#ff9800','16':'#ffb347','32':'#4fc3f7','64':'#00ff88'}[arch])+'44;color:'+({'8':'#ff9800','16':'#ffb347','32':'#4fc3f7','64':'#00ff88'}[arch])+'">▶ '+({'8':'8086/8-Bit','16':'16-Bit Real-Mode','32':'32-Bit Protected','64':'x86_64 Long Mode'}[arch])+'</div>'+r;
  document.getElementById('tp-instructions').innerHTML=i;
  document.getElementById('tp-addressing').innerHTML=addr;
  document.getElementById('tp-syscalls').innerHTML=sc;
  document.getElementById('tp-examples').innerHTML='<div style="margin-bottom:8px"><span style="background:#00ff8822;color:#00ff88;border:1px solid #00ff8844;padding:1px 7px;border-radius:4px;font-size:11px">'+arch+'-Bit · '+({'8':'NASM','16':'NASM','32':'NASM','64':'NASM'}[arch])+'</span></div>'+ex;
  document.getElementById('tp-tools').innerHTML=TOOLS_HTML;
  // update compare highlight
  const colors={'8':'#ff9800','16':'#ffb347','32':'#4fc3f7','64':'#00ff88'};
  document.querySelectorAll('#cmp-body td[id^="cmp-"]').forEach(td=>{
    const a=td.id.split('-')[1];
    td.style.color=a===arch?colors[a]:'var(--text)';
    td.style.background=a===arch?colors[a]+'0a':'';
  });
  document.getElementById('tp-compare').innerHTML=COMPARE_HTML;
  // re-apply highlight after innerHTML replace
  highlightArch();
}

function highlightArch(){
  const colors={'8':'#ff9800','16':'#ffb347','32':'#4fc3f7','64':'#00ff88'};
  document.querySelectorAll('[id^="cmp-"]').forEach(td=>{
    if(!td.id) return;
    const a=td.id.split('-')[1];
    if(a&&colors[a]){
      td.style.color=a===arch?colors[a]:'var(--text)';
      td.style.background=a===arch?colors[a]+'0a':'';
    }
  });
}

// tabs
document.querySelectorAll('.tb[data-tab]').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.tb[data-tab]').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tp').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('tp-'+b.dataset.tab).classList.add('active');
  });
});

document.getElementById('tp-compare').innerHTML=COMPARE_HTML;
renderAll();

</script></body></html>
